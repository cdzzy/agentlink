name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tool
        run: pip install build twine
      - name: Build sdist and wheel
        run: python -m build
      - name: Check distributions
        run: twine check dist/*
      - name: Upload distributions artifact
        uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      # Guard: only proceed when the PYPI_API_TOKEN secret is configured.
      # (The secrets context is unavailable in step/job `if`, so the check
      # runs in a shell and exports an output flag consumed below.)
      - name: Check PYPI_API_TOKEN secret
        id: token-guard
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -z "$PYPI_TOKEN" ]; then
            echo "has-token=false" >> "$GITHUB_OUTPUT"
            echo "::warning::PYPI_API_TOKEN secret is not configured — skipping PyPI publish."
          else
            echo "has-token=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to PyPI
        if: steps.token-guard.outputs.has-token == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true

      - name: PyPI publish skipped (no secret configured)
        if: steps.token-guard.outputs.has-token != 'true'
        run: >-
          echo "PYPI_API_TOKEN secret is not set on this repository —
          PyPI publishing was skipped. Build artifacts remain available
          in the workflow 'distributions' artifact."
